<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LootHub — Arsenal Alpha</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial;background:#0b0f16;color:#eaf0f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #354258;border-radius:10px;padding:11px 15px;background:#1b2738;color:#eaf0f9;font-weight:650}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#e8ad43;color:#16120a;border-color:#e8ad43}.shell{max-width:1200px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #283142;padding-bottom:17px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:#e8ad43}.wallet{font-weight:750;color:#eac171}.nav{display:flex;gap:8px;overflow:auto;padding:18px 0}.nav button.active{background:#33465e;border-color:#6b819e}.layout{display:grid;grid-template-columns:1fr 300px;gap:20px}.panel{background:#131b27;border:1px solid #293648;border-radius:16px;padding:20px;margin-bottom:16px}.muted{color:#91a0b4}.tiny{font-size:12px}.hero{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:24px}.case-art{height:175px;display:grid;place-items:center;font-size:95px;background:radial-gradient(ellipse,#5b4424 0%,#1a2533 62%,transparent 74%);text-shadow:0 12px 30px #000}.price{font-size:30px;font-weight:850;color:#f2c56e}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.item{background:#182334;border:1px solid #354257;border-radius:12px;padding:13px;min-width:0}.item .art{height:82px;display:grid;place-items:center;font-size:48px;background:radial-gradient(ellipse,#2c3e52,#151e2b 70%);border-radius:8px}.item h4{margin:9px 0 4px;font-size:14px}.item p{margin:4px 0;font-size:12px}.item button{width:100%;margin-top:8px;padding:8px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}.Common{color:#a5acb8}.Uncommon{color:#60cf85}.Rare{color:#62a9ff}.SuperRare{color:#c18aff}.Legendary{color:#f5c55b}.hidden{display:none!important}.reel{height:138px;overflow:hidden;position:relative;border:1px solid #53627a;border-radius:12px;background:#0b1019}.track{display:flex;gap:8px;align-items:center;height:100%;width:max-content;transform:translateX(0)}.tile{width:112px;height:114px;flex:none;background:#1d2b3d;border-bottom:5px solid #648bc0;border-radius:8px;text-align:center;padding:12px 5px;font-size:12px}.tile b{display:block;font-size:40px;margin:6px}.pointer{position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #ffd279;z-index:2;pointer-events:none}.notice{border-left:3px solid #e8ad43;padding:10px 14px;background:#25251d;margin:12px 0}.feed{font-size:13px;line-height:1.6;max-height:310px;overflow:auto}.field{background:#0c1420;border:1px solid #39485e;border-radius:8px;color:#fff;padding:10px;width:100%}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #2a3648;padding:9px 0}.modal{position:fixed;inset:0;background:#03070bdc;display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(520px,100%);background:#172231;border:1px solid #4a5d76;border-radius:18px;padding:25px}.dialog .big{font-size:80px;text-align:center;padding:20px}footer{color:#8391a5;font-size:12px;padding:30px 0} @media(max-width:800px){.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr;text-align:center}.case-art{height:140px}.shell{padding:12px}.panel{padding:15px}.top{padding-top:8px}.nav{position:sticky;top:0;z-index:4;background:#0b0f16}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:9px}.item .art{font-size:36px}}
@media(max-width:600px){.top{align-items:flex-start}.brand{font-size:20px}.nav button{white-space:nowrap;flex:none;padding:10px 12px}.hero{gap:8px}.cards{gap:8px}.item h4{overflow-wrap:anywhere}.dialog{max-height:90dvh;overflow:auto}.reel{height:125px}.wallet{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important}}</style></head><body><div class="shell"><header class="top"><div class="brand">LOOT<span>HUB</span> <small class="muted tiny">ARSENAL ALPHA</small></div><div class="wallet">◈ <span id="wallet">0</span> coins</div></header><nav class="nav" id="nav"></nav><main class="layout"><div id="main"></div><aside><section class="panel"><b>PORTFOLIO</b><div id="stats"></div></section><section class="panel"><b>ACTIVITY</b><div class="feed" id="feed"></div></section></aside></main><footer>Fictional single-player economy · No real-money purchases, wagering, or cash-out · Progress saves on this device.</footer></div><div id="overlay"></div>
<script>
const KEY='loothub-arsenal-alpha-v1', tiers=['Common','Uncommon','Rare','Super Rare','Legendary'],odds=[70,20,7.5,2,.5], labels=['Standard Issue','Field Grade','Mil-Spec','Classified','Covert / Special'];
const catalog=[
['Glock-18','Slate Grid',0,6,'🔫'],['USP-S','Dustline',0,7,'🔫'],['MP5','Metro Fade',0,8,'🔫'],['P250','Tarmac',0,5,'🔫'],['Nova','Ash Veil',0,7,'🔫'],
['UMP-45','Signal Green',1,19,'🔫'],['FAMAS','Polar Relay',1,23,'🔫'],['MAC-10','Circuit Blue',1,17,'🔫'],['Five-SeveN','Copper Web',1,21,'🔫'],
['M4A4','Voltage Bloom',2,70,'🔫'],['AK-47','Ghostline',2,85,'🔫'],['AWP','Night Watch',2,105,'🎯'],['Desert Eagle','Solar Ash',2,92,'🔫'],
['AK-47','Crimson Circuit',3,310,'🔫'],['AWP','Eclipse',3,390,'🎯'],['M4A1-S','Prism Burn',3,280,'🔫'],
['Karambit','Golden Talon',4,1900,'🗡️'],['Butterfly Knife','Spectrum',4,2400,'🗡️'],['Bayonet','Black Ember',4,1650,'🗡️']];
let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s||!Array.isArray(s.items))s={coins:0,items:[],history:[],earned:0,spent:0,sales:0,rep:0,openings:0,serial:0,offers:{},tab:'Home'};
let tab=s.tab||'Home',busy=false, pending=null; if(s.pendingReveal){s.pendingReveal=null;savePendingRecovery()} function savePendingRecovery(){localStorage.setItem(KEY,JSON.stringify(s))}
const id=()=>String(Date.now())+'-'+(++s.serial), money=n=>Math.round(n).toLocaleString(),save=()=>{s.tab=tab;localStorage.setItem(KEY,JSON.stringify(s))},log=t=>{s.history.unshift(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+t);s.history=s.history.slice(0,70);save()},itemName=x=>x.kind==='case'?'Sealed Arsenal Case':x.weapon+' | '+x.skin, rarity=x=>x.kind==='case'?'Rare':tiers[x.tier],cls=t=>t.replace(/ /g,''),estimated=x=>x.kind==='case'?25:Math.round(x.base*(x.stattrak?1.65:1)*(x.float<.07?1.4:x.float<.15?1.18:x.float>.45?.75:1)*(x.pattern===777?1.25:1)), caseItem=()=>({id:id(),kind:'case',paid:25}), rng=n=>Math.floor(Math.random()*n);
function roll(){let r=Math.random()*100,t=0;for(let i=0;i<odds.length;i++){t+=odds[i];if(r<t){let pool=catalog.filter(x=>x[2]===i),a=pool[rng(pool.length)],f=Math.random();return {id:id(),kind:'skin',weapon:a[0],skin:a[1],tier:i,base:a[3],emoji:a[4],float:+f.toFixed(6),pattern:rng(1000),stattrak:Math.random()<.1,paid:25}}}throw Error('Drop table invalid')}
function render(){document.getElementById('wallet').textContent=money(s.coins);document.getElementById('nav').innerHTML=['Home','Cases','Market','Inventory','Earn','Portfolio'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');document.getElementById('stats').innerHTML=[['Cash',money(s.coins)],['Inventory value',money(s.items.reduce((a,x)=>a+estimated(x),0))],['Net worth',money(s.coins+s.items.reduce((a,x)=>a+estimated(x),0))],['Cases opened',s.openings],['Reputation',s.rep]].map(a=>'<div class="stat"><span class="muted">'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');document.getElementById('feed').innerHTML=s.history.length?s.history.map(h=>'<div class="stat">'+escapeHTML(h)+'</div>').join(''):'<p class="muted">Your transactions appear here.</p>';let el=document.getElementById('main');el.innerHTML=({Home:home,Cases:cases,Market:market,Inventory:inventory,Earn:earn,Portfolio:portfolio})[tab]();save()}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(t){if(busy)return;tab=t;render()}
function home(){return '<section class="panel hero"><div class="case-art">🧰</div><div><div class="tag Legendary">COLLECTION 001</div><h1>Arsenal Case</h1><p class="muted">One case. Original weapon finishes. Exceptional knives. A whole market to master.</p><div class="price">25 coins</div><div class="row" style="margin-top:15px"><button class="primary" onclick="buy()">Buy sealed case</button><button onclick="go(\'Cases\')">Inspect odds</button></div></div></section><section class="panel"><h2>Make your first trade</h2><p class="muted">Start from zero. Earn coins, buy a sealed case, decide whether to open it or resell it, then negotiate for the best price. Every item has its own condition and market estimate.</p><button onclick="go(\'Earn\')">Earn starting coins →</button></section>'}
function cases(){return '<section class="panel hero"><div class="case-art">🧰</div><div><div class="tag Legendary">ARSENAL CASE · 001</div><h1>Arsenal Case</h1><p class="muted">Sealed case · permanently versioned drop table</p><div class="price">25 coins</div><div class="row"><button class="primary" onclick="buy()">Purchase case</button><button onclick="go(\'Inventory\')">My inventory</button></div></div></section><section class="panel"><h3>Published drop odds</h3>'+tiers.map((t,i)=>'<div class="stat"><span class="'+cls(t)+'">'+t+' <small class="muted">('+labels[i]+')</small></span><b>'+odds[i]+'%</b></div>').join('')+'<p class="muted tiny">Each tier roll is independent. StatTrak has a separate 10% chance on weapon/knife rewards. Float is uniform from 0 to 1. Actual market prices may vary.</p></section><section class="panel"><h3>Possible finishes</h3><div class="cards">'+catalog.map(x=>'<div class="item"><div class="art">'+x[4]+'</div><h4>'+x[0]+' | '+x[1]+'</h4><div class="tag '+cls(tiers[x[2]])+'">'+tiers[x[2]]+'</div></div>').join('')+'</div></section>'}
function card(x){let r=rarity(x);return '<div class="item"><div class="art">'+(x.kind==='case'?'🧰':x.emoji)+'</div><div class="tag '+cls(r)+'">'+r+'</div><h4>'+escapeHTML(itemName(x))+'</h4><p class="muted">'+(x.kind==='case'?'Unopened · tradeable':(x.stattrak?'StatTrak · ':'')+wear(x.float)+' · Float '+x.float)+'</p><b>≈ '+money(estimated(x))+' coins</b><button onclick="inspect(\''+x.id+'\')">Inspect / trade</button></div>'}
function inventory(){return '<section class="panel"><div class="row space"><h2>Inventory</h2><select id="filter" class="field" style="width:155px" onchange="filterInv()"><option value="all">All rarities</option>'+tiers.map(t=>'<option>'+t+'</option>').join('')+'</select></div><p class="muted">Each case and skin is individually owned. Market values are estimates, not guaranteed offers.</p><div id="inventoryGrid" class="cards">'+s.items.map(card).join('')+'</div>'+(s.items.length?'':'<p class="muted">Nothing here yet. Buy your first case.</p>')+'</section>'}
function filterInv(){let f=document.getElementById('filter').value;document.getElementById('inventoryGrid').innerHTML=s.items.filter(x=>f==='all'||rarity(x)===f).map(card).join('')}
function market(){let listings=[{name:'Sealed Arsenal Case',price:29,type:'case'},{name:'Discount Arsenal Case',price:23,type:'case'},{name:'Collector Arsenal Case',price:32,type:'case'}];return '<section class="panel"><h2>LootBay Marketplace</h2><p class="muted">NPC sellers offer cases at different prices. Make a counteroffer on a listing, or buy immediately.</p><div class="cards">'+listings.map((x,i)=>'<div class="item"><div class="art">🧰</div><h4>'+x.name+'</h4><p class="muted">Seller #'+(i+1)+'</p><b>'+x.price+' coins</b><button onclick="marketBuy('+x.price+')">Buy now</button><button onclick="negotiate('+x.price+')">Make offer</button></div>').join('')+'</div></section><section class="panel"><h3>Sell your loot</h3><p class="muted">Open your inventory and inspect an item to accept an instant dealer quote or negotiate a better price.</p><button onclick="go(\'Inventory\')">Go to inventory</button></section>'}
function earn(){return '<section class="panel"><h2>MicroTasks</h2><p class="muted">A tiny fallback income. Each click earns one coin. No energy system or cooldown. Your real wealth comes from trading.</p><div class="price">'+money(s.earned)+' earned lifetime</div><p><button class="primary" style="font-size:20px;padding:24px 36px" onclick="clickEarn()">◈ Earn 1 coin</button></p><p class="muted">Starter case: 25 coins · '+Math.max(0,25-s.coins)+' more needed</p></section>'}
function portfolio(){return '<section class="panel"><h2>Trading history</h2>'+[['Total earned by clicking',s.earned],['Total spent on purchases',s.spent],['Total sales proceeds',s.sales],['Cases opened',s.openings],['Reputation',s.rep]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+money(x[1])+'</b></div>').join('')+'<p class="muted tiny">Reputation is recorded now; specialist-market unlocks are reserved for future updates.</p></section>'}
function clickEarn(){s.coins++;s.earned++;save();render()}
function purchase(price){if(s.coins<price){alert('Not enough coins. Visit MicroTasks or sell an item.');return false}s.coins-=price;s.spent+=price;let x=caseItem();x.paid=price;s.items.push(x);log('Purchased sealed Arsenal Case for '+price+' coins');render();return true}
function buy(){if(purchase(25))inspect(s.items[s.items.length-1].id)}
function marketBuy(price){if(purchase(price))inspect(s.items[s.items.length-1].id)}
function wear(f){return f<.07?'Factory New':f<.15?'Minimal Wear':f<.38?'Field-Tested':f<.45?'Well-Worn':'Battle-Scarred'}
function dialog(html){document.getElementById('overlay').innerHTML='<div class="modal" onclick="if(event.target===this)closeDialog()"><div class="dialog">'+html+'</div></div>'}
function closeDialog(){if(busy)return;document.getElementById('overlay').innerHTML=''}
function inspect(k){let x=s.items.find(v=>v.id===k);if(!x)return;let v=estimated(x);dialog('<div class="tag '+cls(rarity(x))+'">'+rarity(x)+'</div><div class="big">'+(x.kind==='case'?'🧰':x.emoji)+'</div><h2>'+escapeHTML(itemName(x))+'</h2><p class="muted">'+(x.kind==='case'?'Sealed · Arsenal Case':(x.stattrak?'StatTrak · ':'')+wear(x.float)+' · Float '+x.float+' · Pattern '+x.pattern)+'</p><h3>Estimated market value: '+money(v)+' coins</h3><p class="muted tiny">Market estimate is not a guaranteed sale price.</p><div class="row">'+(x.kind==='case'?'<button class="primary" onclick="openCase(\''+x.id+'\')">Open case</button>':'')+'<button onclick="sellNow(\''+x.id+'\')">Instant sell ('+Math.round(v*.78)+')</button><button onclick="sellOffer(\''+x.id+'\')">Negotiate</button><button onclick="closeDialog()">Keep item</button></div>')}
function sellNow(k){let x=s.items.find(v=>v.id===k);if(!x)return;let p=Math.round(estimated(x)*.78);s.items=s.items.filter(v=>v.id!==k);s.coins+=p;s.sales+=p;s.rep++;log('Sold '+itemName(x)+' for '+p+' coins');closeDialog();render()}
function sellOffer(k){let x=s.items.find(v=>v.id===k);if(!x)return;let v=estimated(x);dialog('<h2>Negotiate a sale</h2><p class="muted">A collector is interested in '+escapeHTML(itemName(x))+'. Their budget and patience are limited.</p><p>Market estimate: '+money(v)+' coins</p><label>Your asking price <input class="field" id="ask" type="number" min="1" value="'+Math.round(v*1.06)+'"></label><p><button class="primary" onclick="respondOffer(\''+k+'\')">Send offer</button> <button onclick="inspect(\''+k+'\')">Back</button></p><div id="response"></div>')}
function respondOffer(k){let x=s.items.find(v=>v.id===k);if(!x)return;let ask=Math.floor(Number(document.getElementById('ask').value)),v=estimated(x),key='sale-'+k;let o=s.offers[key]||(s.offers[key]={limit:Math.round(v*(.87+Math.random()*.26)),attempts:0});if(!Number.isFinite(ask)||ask<1){document.getElementById('response').textContent='Enter a valid asking price.';return}o.attempts++;if(ask<=o.limit){s.items=s.items.filter(y=>y.id!==k);s.coins+=ask;s.sales+=ask;s.rep+=2;delete s.offers[key];log('Negotiated sale of '+itemName(x)+' for '+ask+' coins');closeDialog();render()}else if(o.attempts>=3){document.getElementById('response').textContent='Buyer walked away. Keep the item or try another buyer later.';delete s.offers[key];save()}else{document.getElementById('response').textContent='Buyer counters at '+Math.round(o.limit*(.91+.03*o.attempts))+' coins. Attempts '+o.attempts+'/3';save()}}
function negotiate(price){let limit=Math.max(1,Math.round(price*(.78+Math.random()*.17)));dialog('<h2>Negotiate purchase</h2><p class="muted">The seller is asking '+price+' coins for a sealed Arsenal Case.</p><input id="offer" class="field" type="number" min="1" value="'+Math.round(price*.8)+'"><p><button class="primary" onclick="makeOffer('+limit+')">Send offer</button> <button onclick="closeDialog()">Cancel</button></p><div id="response"></div>')}
function makeOffer(limit){let n=Math.floor(Number(document.getElementById('offer').value));if(!Number.isFinite(n)||n<1){document.getElementById('response').textContent='Enter a valid offer.';return}if(n>=limit){if(purchase(n)){closeDialog();inspect(s.items[s.items.length-1].id)}}else document.getElementById('response').textContent='Seller declines. Try offering more.'}
function openCase(k){if(busy)return;let x=s.items.find(v=>v.id===k);if(!x||x.kind!=='case')return;busy=true;let reward=roll();s.pendingReveal=reward.id;s.items=s.items.filter(v=>v.id!==k);s.items.push(reward);s.openings++;log('Opened Arsenal Case → '+itemName(reward)+' ('+tiers[reward.tier]+')');save();let sequence=Array.from({length:48},()=>catalog[rng(catalog.length)]);sequence[42]=[reward.weapon,reward.skin,reward.tier,reward.base,reward.emoji];let tiles=sequence.map(a=>'<div class="tile" style="border-color:'+['#9ba6b7','#5acc7c','#579bf1','#ad6def','#e7b64e'][a[2]]+'"><b>'+a[4]+'</b>'+escapeHTML(a[0])+'</div>').join('');dialog('<h2>Opening Arsenal Case</h2><div class="reel"><div class="pointer"></div><div class="track" id="track">'+tiles+'</div></div><p class="muted tiny">Reward is already saved. Closing or reloading cannot reroll it.</p><button onclick="finishOpening()">Skip animation</button>');let track=document.getElementById('track');track.style.transition='transform 6.5s cubic-bezier(.09,.75,.12,1)';requestAnimationFrame(()=>requestAnimationFrame(()=>{track.style.transform='translateX('+Math.round(track.parentElement.clientWidth/2-(42*120+56))+'px)'}));pending={reward,timer:setTimeout(finishOpening,6700)}}
function finishOpening(){if(!pending)return;clearTimeout(pending.timer);let x=pending.reward;pending=null;busy=false;s.pendingReveal=null;save();render();dialog('<div class="tag '+cls(tiers[x.tier])+'">'+tiers[x.tier]+'</div><div class="big">'+x.emoji+'</div><h2>'+escapeHTML(itemName(x))+'</h2><p class="muted">'+(x.stattrak?'StatTrak · ':'')+wear(x.float)+' · Float '+x.float+' · Pattern '+x.pattern+'</p><div class="price">≈ '+money(estimated(x))+' coins</div><p class="muted tiny">Estimated market value, not guaranteed sale proceeds.</p><div class="row"><button class="primary" onclick="inspect(\''+x.id+'\')">Inspect / sell</button><button onclick="closeDialog()">Keep item</button></div>')}
window.addEventListener('beforeunload',save);render();
</script></body></html>
