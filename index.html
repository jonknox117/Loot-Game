<script>
const KEY='loothub-arsenal-alpha-v1', tiers=['Common','Uncommon','Rare','Super Rare','Legendary'],odds=[70,20,7.5,2,.5], labels=['Standard Issue','Field Grade','Mil-Spec','Classified','Covert / Special'];
const catalog=window.LootHubWeaponCatalog.catalog;
// Every cosmetic finish here must be explicitly approved by the user.
const approvedSkins=[['MAC-10','Red Devil',4,1800,'🔫'],
['RPG-7','Glory',3,1200,'🔫'],
['Colt .45 Revolver','High Stakes',3,900,'🔫'],
['Butterfly Knife','The Hydra',4,3600,'🗡️'],
['FN FAL','The Luck O The Irish',2,320,'🔫'],
['Tactical Machete','Predator',2,260,'🗡️'],
['Desert Eagle','Blossom',3,950,'🔫'],
['Karambit','Kryptonite',4,3800,'🗡️'],
['SPAS-12','Blood Thirsty',3,1100,'🔫'],
['AWP','Crimson Delight',4,4200,'🎯']];
const cartelCase=window.LootHubCartelCase;
const cartelSkins=cartelCase.items.map(x=>[x.weapon,x.skin,x.tier,x.base,x.emoji]);
const cartelCatalog=cartelCase.items.map(x=>({...x}));
const dropCatalog=catalog.map(a=>({kind:'weapon',weapon:a[0],tier:a[1],base:a[2],emoji:a[3]})).concat(approvedSkins.map(a=>({kind:'skin',weapon:a[0],skin:a[1],tier:a[2],base:a[3],emoji:a[4]})));
const universalSkinLines=window.LootHubSkinLines;
const allSkinLines=[...universalSkinLines.lines,...universalSkinLines.previewLines];
const lineCatalogs=Object.fromEntries(allSkinLines.map(line=>[line.id,universalSkinLines.variants(catalog,line.id)]));
const allMarketCatalog=dropCatalog.concat(cartelCatalog,...universalSkinLines.lines.map(line=>lineCatalogs[line.id]));
let s=loadGame(KEY);if(!s||!Array.isArray(s.items))s={coins:0,items:[],history:[],earned:0,spent:0,sales:0,rep:0,openings:0,serial:0,offers:{},tab:'Home'};if(!Array.isArray(s.listings))s.listings=[];if(!Array.isArray(s.ledger))s.ledger=[];if(!s.preferences)s.preferences={fastOpen:false};window.LootHubMarketCore.ensureMarketState(s);window.LootHubWear.ensureGame(s);window.LootHubFX.setMuted(s.preferences.fxMuted===true);
let tab=s.tab||'Home',busy=false, pending=null; if(s.pendingReveal&&!recoveryRequired){s.pendingReveal=null;savePendingRecovery()} function savePendingRecovery(){localStorage.setItem(KEY,JSON.stringify(s))}
const id=()=>String(Date.now())+'-'+(++s.serial), money=n=>Math.round(n).toLocaleString(),save=()=>persistGame(s,tab),log=t=>{recordActivity(s,t);save()},itemName=x=>x.kind==='case'?(x.caseId==='cartel'?'Sealed Cartel Case':x.caseId&&universalSkinLines.getLine(x.caseId)?'Sealed '+universalSkinLines.getLine(x.caseId).name+' Case':'Sealed Arsenal Case'):x.kind==='skin'?x.weapon+' | '+x.skin:x.weapon, rarity=x=>x.kind==='case'?'Rare':tiers[x.tier],cls=t=>t.replace(/ /g,''),estimated=x=>window.LootHubMarketCore.estimated(x), caseItem=(caseId='arsenal',paid=25)=>({id:id(),kind:'case',paid,...(caseId==='arsenal'?{}:{caseId})}), rng=n=>Math.floor(Math.random()*n);
function roll(caseId='arsenal'){
  if(caseId!=='arsenal'&&caseId!=='cartel'&&universalSkinLines.getLine(caseId)?.released!==true)throw Error('Unreleased case '+caseId);
  const lootPool=caseId==='arsenal'?dropCatalog:caseId==='cartel'?cartelCatalog:lineCatalogs[caseId];
  if(!lootPool||!lootPool.length)throw Error('Unregistered case '+caseId);
  // A themed case may not have a weapon at every rarity. Redistribute the
  // original published tier weights proportionally across populated tiers.
  // Arsenal continues using its original 70/20/7.5/2/0.5 distribution.
  const buckets=odds.map((weight,tier)=>({weight,tier,pool:lootPool.filter(x=>x.tier===tier)}))
    .filter(bucket=>bucket.pool.length);
  const total=buckets.reduce((sum,bucket)=>sum+bucket.weight,0);
  if(total<=0)throw Error('Drop table invalid');
  let r=Math.random()*total;
  for(const bucket of buckets){
    if(r<bucket.weight){
      const item={id:id(),...bucket.pool[rng(bucket.pool.length)],
        paid:caseId==='arsenal'?25:caseId==='cartel'?cartelCase.casePrice:universalSkinLines.getLine(caseId).casePrice};
      window.LootHubWear.assignRolled(item,Math.random);
      return item;
    }
    r-=bucket.weight;
  }
  throw Error('Drop table invalid');
}
function render(){marketTick();document.getElementById('wallet').textContent=money(s.coins);document.getElementById('nav').innerHTML=['Home','Cases','Market','Inventory','Earn','Portfolio','Saves'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');document.getElementById('stats').innerHTML=[['Cash',money(s.coins)],['Assets value',money(s.items.reduce((a,x)=>a+window.LootHubEconomy.marketValue(s,x),0)+s.listings.reduce((a,x)=>a+window.LootHubEconomy.marketValue(s,x.item),0))],['Net worth',money(s.coins+s.items.reduce((a,x)=>a+window.LootHubEconomy.marketValue(s,x),0)+s.listings.reduce((a,x)=>a+window.LootHubEconomy.marketValue(s,x.item),0))],['Cases opened',s.openings],['Reputation',s.rep]].map(a=>'<div class="stat"><span class="muted">'+a[0]+'</span><b>'+a[1]+'</b></div>').join('');document.getElementById('feed').innerHTML=s.history.length?s.history.slice(0,18).map(h=>'<div class="stat">'+escapeHTML(h)+'</div>').join(''):'<p class="muted">Your transactions appear here.</p>';let el=document.getElementById('main');window.LootHubWearRenderer.release(el);el.innerHTML=({Home:home,Cases:()=>collectionBookOpen?collectionBook():universalCases(),Market:market,Inventory:inventory,Earn:earn,Portfolio:portfolio,Saves:saveHub})[tab]();window.LootHubWearRenderer.attach(el);save();updateSoundToggle()}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateSoundToggle(){
 const control=document.getElementById('soundToggle');
 if(!control)return;
 const on=!window.LootHubFX.isMuted();
 control.textContent=on?'Sound: On':'Sound: Off';
 if(typeof control.setAttribute==='function')control.setAttribute('aria-pressed',String(on));
}
function toggleSound(){
 const muted=window.LootHubFX.setMuted(!window.LootHubFX.isMuted());
 s.preferences.fxMuted=muted;save();updateSoundToggle();
 if(!muted)window.LootHubFX.play('confirm');
}
function go(t){if(busy)return;if(tab!==t)window.LootHubFX.play('navigate');if(t!=='Cases'){collectionBookOpen=false;selectedCollectionId=null}tab=t;render()}
function home(){return '<section class="panel hero"><div class="case-art">'+visualArt({kind:'case'})+'</div><div><div class="tag Legendary">COLLECTION 001</div><h1>Arsenal Case</h1><p class="muted">The original Arsenal collection: '+catalog.length+' base weapons and '+approvedSkins.length+' approved finishes. Explore the Cartel Case under Cases.</p><div class="price">25 coins</div>'+multiPurchaseControl('arsenal')+'<div class="row" style="margin-top:10px"><button onclick="buy()">Buy one sealed case</button><button onclick="go(\'Cases\')">Inspect odds</button></div></div></section><section class="panel"><h2>Make your first trade</h2><p class="muted">Start from zero. Earn coins, buy a sealed case, decide whether to open it or resell it, then negotiate for the best price. Every base weapon has its own market estimate.</p><button onclick="go(\'Earn\')">Earn starting coins →</button></section>'}
function cases(){return '<section class="panel hero"><div class="case-art">'+visualArt({kind:'case'})+'</div><div><div class="tag Legendary">ARSENAL CASE · 001</div><h1>Arsenal Case</h1><p class="muted">Sealed case · '+catalog.length+' base weapons · '+approvedSkins.length+' approved skins</p><div class="price">25 coins</div>'+multiPurchaseControl('arsenal')+'<div class="row"><button onclick="buy()">Buy one sealed case</button><button onclick="go(\'Inventory\')">My inventory</button></div></div></section><section class="panel"><h3>Published drop odds</h3>'+tiers.map((t,i)=>'<div class="stat"><span class="'+cls(t)+'">'+t+' <small class="muted">('+labels[i]+')</small></span><b>'+odds[i]+'%</b></div>').join('')+'<p class="muted tiny">Each tier roll is independent. Only personally approved skins can be included; '+approvedSkins.length+' owner-approved skins are active.</p></section><section class="panel"><h3>Available base weapons</h3><div class="cards">'+catalog.map((x,i)=>'<div class="item">'+visualArt({kind:'weapon',weapon:x[0],tier:x[1],base:x[2]})+'<h4>'+escapeHTML(x[0])+'</h4><div class="tag '+cls(tiers[x[1]])+'">'+tiers[x[1]]+'</div><button onclick="previewCatalogWeapon('+i+')">View weapon</button></div>').join('')+'</div></section><section class="panel"><h3>Approved skin finishes</h3><p class="muted">Each released skin is chosen and approved by the game owner.</p><div class="cards">'+approvedSkins.map((x,i)=>'<div class="item">'+visualArt({kind:'skin',weapon:x[0],skin:x[1],tier:x[2],base:x[3]})+'<h4>'+escapeHTML(x[0]+' | '+x[1])+'</h4><div class="tag '+cls(tiers[x[2]])+'">'+tiers[x[2]]+'</div><button onclick="previewApprovedSkin('+i+')">View skin</button></div>').join('')+'</div></section>'}

 return '<section class="panel cartel-section"><div class="cartel-showcase">'+

function universalCases(){
  if(!allSkinLines.length)return collectionEntry()+multiOpenEntry()+cartelSection()+cases();
  const extra=allSkinLines.map(line=>{
    const variants=lineCatalogs[line.id]||[];
    if(!variants.length)return '';
    const sample=variants.find(x=>x.weapon==='FN FAL')||variants[0];
    const isPreview=line.preview===true&&line.released!==true;
    return '<div class="item">'+visualArt(sample)+
      '<h4>'+escapeHTML(line.name)+' Case'+(isPreview?' · TEST':'')+'</h4><p class="muted tiny">'+
      escapeHTML(line.description)+'</p><p class="muted tiny">'+variants.length+
      ' weapon variants · '+(isPreview?'free visual test · nothing added to inventory':line.casePrice+' coins')+
      '</p><button onclick="previewSkinLine(\''+line.id+'\')">View collection</button>'+
      (isPreview?'<button class="primary" onclick="openPreviewCase(\''+line.id+'\')">Open free test case</button>':
      '<button class="primary" onclick="buySkinLineCase(\''+line.id+'\')">Buy '+escapeHTML(line.name)+' Case</button>')+
      '</div>';
  }).join('');
  return collectionEntry()+multiOpenEntry()+cartelSection()+cases()+'<section class="panel"><h2>'+ (universalSkinLines.lines.length?'Universal skin-line cases':'Procedural skin-line preview cases')+
    '</h2><p class="muted">Buy a sealed themed case to collect its skins. Drop chances follow the published rarity weights, normalized over rarities available in that case.</p>'+
    '<div class="cards">'+extra+'</div></section>';
}
function previewSkinLine(lineId){
  const line=universalSkinLines.getLine(lineId);
  if(!line)return;
  const skins=lineCatalogs[lineId]||[];
  dialog('<div class="section-eyebrow">SKIN LINE</div><h2>'+escapeHTML(line.name)+
    '</h2><p class="muted">'+escapeHTML(line.description)+'</p><div class="cards">'+
    skins.map(x=>'<div class="item">'+visualArt(x)+
      '<h4>'+escapeHTML(x.weapon+' | '+x.skin)+'</h4></div>').join('')+
    '</div><p><button class="primary" onclick="closeDialog()">Close</button></p>');
}
function buySkinLineCase(lineId){
  const line=universalSkinLines.getLine(lineId);
  if(line&&line.released===true&&purchase(line.casePrice,lineId))inspect(s.items[s.items.length-1].id);
}
function previewCatalogWeapon(index){
  const a=catalog[index];
  if(!a)return;
  const x={kind:'weapon',weapon:a[0],tier:a[1],base:a[2]};
  dialog('<div class="section-eyebrow">BASE WEAPON PREVIEW</div><div class="tag '+cls(tiers[x.tier])+'">'+tiers[x.tier]+'</div>'+
    '<div class="big reveal-art catalog-preview">'+visualArt(x,'inspect')+'</div>'+
    '<h2>'+escapeHTML(itemName(x))+'</h2>'+
    '<p class="muted">Neutral master image. The neutral weapon is separately obtainable; approved skins are listed below.</p>'+
    '<div class="row"><button class="primary" onclick="closeDialog()">Back to collection</button></div>');
}
function previewApprovedSkin(index){
  const a=approvedSkins[index];
  if(!a)return;
  const x={kind:'skin',weapon:a[0],skin:a[1],tier:a[2],base:a[3]};
  dialog('<div class="section-eyebrow">OWNER-APPROVED SKIN</div><div class="tag '+cls(tiers[x.tier])+'">'+tiers[x.tier]+'</div>'+
    '<div class="big reveal-art catalog-preview">'+visualArt(x,'inspect')+'</div>'+
    '<h2>'+escapeHTML(itemName(x))+'</h2><p class="muted">Approved original finish. Art preview only; no coins spent.</p>'+
    '<div class="row"><button class="primary" onclick="closeDialog()">Back to collection</button></div>');
}
function card(x){let r=rarity(x);return '<div class="item">'+visualArt(x)+'<div class="tag '+cls(r)+'">'+r+'</div><h4>'+escapeHTML(itemName(x))+'</h4><p class="muted">'+(x.kind==='case'?'Unopened · tradeable':(x.kind==='skin'?'Approved skin · '+x.skin:'Base weapon · unskinned'))+'</p><p class="muted tiny">'+conditionTag(x)+'</p><b>≈ '+money(marketEstimate(x))+' coins</b><button onclick="inspect(\''+x.id+'\')">Inspect / trade</button></div>'}
function inventory(){return '<section class="panel"><div class="row space"><h2>Inventory</h2><select id="filter" class="field" style="width:155px" onchange="filterInv()"><option value="all">All rarities</option>'+tiers.map(t=>'<option>'+t+'</option>').join('')+'</select></div><p class="muted">Your base weapons and owner-approved skins are individually collectible and tradable. Market values are estimates.</p><div class="row multi-inventory-action"><button onclick="openCollectionBook()">Collection Book</button><button class="primary" onclick="showMultiPicker()" '+(s.items.some(x=>x.kind==='case')?'':'disabled')+'>Open up to 5 cases</button></div><div id="inventoryGrid" class="cards">'+s.items.map(card).join('')+'</div>'+(s.items.length?'':'<p class="muted">Nothing here yet. Buy your first case.</p>')+'</section>'}
function filterInv(){let f=document.getElementById('filter').value;const grid=document.getElementById('inventoryGrid');window.LootHubWearRenderer.release(grid);grid.innerHTML=s.items.filter(x=>f==='all'||rarity(x)===f).map(card).join('');window.LootHubWearRenderer.attach(grid)}
function market(){return barterEntry()+enhancedMarket()}
function earn(){return '<section class="panel"><h2>MicroTasks</h2><p class="muted">A tiny fallback income. Each click earns one coin. No energy system or cooldown. Your real wealth comes from trading.</p><div class="price">'+money(s.earned)+' earned lifetime</div><p><button class="primary" style="font-size:20px;padding:24px 36px" onclick="clickEarn()">◈ Earn 1 coin</button></p><p class="muted">Starter case: 25 coins · '+Math.max(0,25-s.coins)+' more needed</p></section>'}
function portfolio(){return enhancedPortfolio()}
function clickEarn(){if(!canMutate())return;window.LootHubFX.play('coin');s.coins++;s.earned++;save();render()}
function purchase(price,caseId='arsenal'){if(!canMutate())return false;if(s.coins<price){window.LootHubFX.play('error');alert('Not enough coins. Visit MicroTasks or sell an item.');return false}if(!window.LootHubMarketTransactions.purchaseCase(s,price,()=>caseItem(caseId,price)))return false;window.LootHubFX.play('purchase');log('Purchased sealed '+(caseId==='cartel'?'Cartel':universalSkinLines.getLine(caseId)?.name||'Arsenal')+' Case for '+price+' coins');render();return true}
function buy(){if(purchase(25))inspect(s.items[s.items.length-1].id)}
function marketBuy(price){if(purchase(price))inspect(s.items[s.items.length-1].id)}
function wear(f){return f<.07?'Factory New':f<.15?'Minimal Wear':f<.38?'Field-Tested':f<.45?'Well-Worn':'Battle-Scarred'}
function dialog(html){const overlay=document.getElementById('overlay');overlay.innerHTML='<div class="modal" onclick="if(event.target===this)closeDialog()"><div class="dialog" role="dialog" aria-modal="true">'+html+'</div></div>';window.LootHubWearRenderer.attach(overlay)}
function closeDialog(){if(busy)return;window.LootHubFX.stopReel();document.getElementById('overlay').innerHTML=''}
function inspect(k){let x=s.items.find(v=>v.id===k);if(!x)return;let v=estimated(x);dialog('<div class="tag '+cls(rarity(x))+'">'+rarity(x)+'</div><div class="big reveal-art">'+visualArt(x,'inspect')+'</div><h2>'+escapeHTML(itemName(x))+'</h2><p class="muted">'+(x.kind==='case'?'Sealed · '+(x.caseId==='cartel'?'Cartel Case':'Arsenal Case'):x.kind==='skin'?'Approved skin · '+x.skin:'Base weapon · unskinned')+'</p><p>'+conditionTag(x)+'</p>'+conditionPriceRows(x)+'<h3>Estimated market value: '+money(marketEstimate(x))+' coins</h3><p class="muted tiny">Market estimate includes trading activity and supply; it is not a guaranteed sale price. Instant sell uses the condition-adjusted value.</p><div class="row">'+(x.kind==='case'?'<button class="primary" onclick="openCase(\''+x.id+'\')">Open case</button><button onclick="showMultiPicker([\''+x.id+'\'])">Multi-open</button>':'')+'<button onclick="sellNow(\''+x.id+'\')">Instant sell ('+Math.round(v*.78)+')</button><button onclick="sellOffer(\''+x.id+'\')">Negotiate</button><button onclick="listItem(\''+x.id+'\')">List for sale</button><button onclick="closeDialog()">Keep item</button></div>')}
function sellNow(k){if(!canMutate())return;let x=s.items.find(v=>v.id===k);if(!x)return;let p=Math.round(estimated(x)*.78);if(!window.LootHubMarketTransactions.sellOwned(s,k,p,1))return;log('Sold '+itemName(x)+' for '+p+' coins');closeDialog();render()}
function sellOffer(k){let x=s.items.find(v=>v.id===k);if(!x)return;let v=estimated(x);dialog('<h2>Negotiate a sale</h2><p class="muted">A collector is interested in '+escapeHTML(itemName(x))+'. Their budget and patience are limited.</p><p>Market estimate: '+money(v)+' coins</p><label>Your asking price <input class="field" id="ask" type="number" min="1" value="'+Math.round(v*1.06)+'"></label><p><button class="primary" onclick="respondOffer(\''+k+'\')">Send offer</button> <button onclick="inspect(\''+k+'\')">Back</button></p><div id="response"></div>')}
function respondOffer(k){if(!canMutate())return;let x=s.items.find(v=>v.id===k);if(!x)return;let ask=Math.floor(Number(document.getElementById('ask').value)),v=estimated(x),key='sale-'+k;let o=s.offers[key]||(s.offers[key]={limit:Math.round(v*(.87+Math.random()*.26)),attempts:0});if(!window.LootHubMarketCore.validAsk(ask)){document.getElementById('response').textContent='Enter a valid whole-coin asking price.';return}if(o.closed||o.attempts>=3){document.getElementById('response').textContent='This buyer already walked away from this item.';return}o.attempts++;if(ask<=o.limit){if(!window.LootHubMarketTransactions.sellOwned(s,k,ask,2))return;delete s.offers[key];log('Negotiated sale of '+itemName(x)+' for '+ask+' coins');closeDialog();render()}else if(o.attempts>=3){o.closed=true;document.getElementById('response').textContent='Buyer walked away. This item cannot be renegotiated with the same buyer.';save()}else{document.getElementById('response').textContent='Buyer counters at '+Math.round(o.limit*(.91+.03*o.attempts))+' coins. Attempts '+o.attempts+'/3';save()}}
function negotiate(price){let limit=Math.max(1,Math.round(price*(.78+Math.random()*.17)));dialog('<h2>Negotiate purchase</h2><p class="muted">The seller is asking '+price+' coins for a sealed Arsenal Case.</p><input id="offer" class="field" type="number" min="1" value="'+Math.round(price*.8)+'"><p><button class="primary" onclick="makeOffer('+limit+')">Send offer</button> <button onclick="closeDialog()">Cancel</button></p><div id="response"></div>')}
function makeOffer(limit){let n=Math.floor(Number(document.getElementById('offer').value));if(!Number.isFinite(n)||n<1){document.getElementById('response').textContent='Enter a valid offer.';return}if(n>=limit){if(purchase(n)){closeDialog();inspect(s.items[s.items.length-1].id)}}else document.getElementById('response').textContent='Seller declines. Try offering more.'}
function openCase(k){
 if(busy||!canMutate())return;
 const owned=s.items.find(v=>v.id===k);
 if(!owned||owned.kind!=='case')return;
 const caseId=owned.caseId||'arsenal';
 if(caseId!=='arsenal'&&caseId!=='cartel'&&universalSkinLines.getLine(caseId)?.released!==true)return;
 const reelPool=caseId==='arsenal'?dropCatalog:caseId==='cartel'?cartelCatalog:lineCatalogs[caseId];
 if(!reelPool?.length)return;
 // Commit the outcome before animation: skip, refresh and sound never reroll prizes.
 busy=true;
 const reward=roll(caseId);
 s.pendingReveal=reward.id;
 s.items=s.items.filter(v=>v.id!==k);
 s.items.push(reward);
 s.openings++;
 log('Opened '+itemName(owned)+' → '+itemName(reward)+' ('+tiers[reward.tier]+')');
 save();
 window.LootHubFX.play('open');
 const sequence=Array.from({length:48},()=>({...reelPool[rng(reelPool.length)]}));
 sequence[42]=reward;
 const colors=['#9ba6b7','#5acc7c','#579bf1','#ad6def','#e7b64e'];
 const tiles=sequence.map((entry,i)=>{
  const sample=i===42?entry:{...entry,id:'reel-preview-'+i+'-'+(entry.weapon||''),
   wearGrade:window.LootHubWear.rollGrade(()=>
    window.LootHubWearRenderer.hash('reel:'+i+':'+(entry.weapon||'')+':'+(entry.skin||''))/4294967296)};
  return '<div class="tile" data-reel-index="'+i+'" style="border-color:'+colors[entry.tier]+';--tile-accent:'+colors[entry.tier]+'">'+
   visualArt(sample,'reel')+'<span class="tile-name">'+escapeHTML(entry.weapon)+'</span></div>';
 }).join('');
 dialog('<div class="reel-header"><span class="spin-eyebrow">'+(caseId==='cartel'?'CARTEL':'ARSENAL')+' • REWARD DROP</span><span class="spin-pulse">OPENING</span></div>'+
  '<h2 class="spin-title">Opening '+escapeHTML(itemName(owned))+'</h2>'+
  '<div class="reel-stage"><div class="reel" aria-label="Case opening reel"><div class="pointer"></div>'+
  '<div class="track" id="track">'+tiles+'</div></div></div>'+
  '<p class="muted tiny spin-note">Your reward is already saved. Skipping cannot change the result.</p>'+
  '<button class="spin-skip" onclick="finishOpening()">Skip animation</button>');
 const track=document.getElementById('track');
 const reduced=window.LootHubFX.motionReduced();
 const duration=reduced?0:6500;
 const target=Math.round(track.parentElement.clientWidth/2-(42*120+56));
 track.style.transition=reduced?'none':'transform 6.5s cubic-bezier(.09,.75,.12,1)';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{track.style.transform='translateX('+target+'px)'}));
 if(!reduced)window.LootHubFX.startReel(track,track.parentElement);
 pending={reward,caseId,timer:setTimeout(finishOpening,duration+200)};
}
function finishOpening(){
 if(!pending)return;
 clearTimeout(pending.timer);
 window.LootHubFX.stopReel();
 const reward=pending.reward,caseId=pending.caseId||'arsenal';
 pending=null;busy=false;s.pendingReveal=null;save();render();
 window.LootHubFX.play('reveal',{tier:reward.tier});
 const grade=tiers[reward.tier],tierClass=cls(grade);
 dialog('<div class="reward-reveal rarity-'+tierClass+'">'+
  '<div class="reward-sheen" aria-hidden="true"></div>'+
  '<div class="reward-kicker">NEW ITEM ACQUIRED</div>'+
  '<div class="tag '+tierClass+'">'+grade+'</div>'+
  ((caseId==='arsenal'||caseId==='cartel')?
   '<div class="big reveal-art reward-art arsenal-reward-display'+(caseId==='cartel'?' cartel-reward-display':'')+'">'+
   '<div class="arsenal-reward-weapon">'+visualArt(reward,'inspect')+'</div>'+
   '<div class="arsenal-reward-crate">'+visualArt({kind:'case',caseId},'open')+'</div></div>':
   '<div class="big reveal-art reward-art">'+visualArt(reward,'inspect')+'</div>')+
  '<h2 class="reward-name">'+escapeHTML(itemName(reward))+'</h2>'+
  '<p class="muted">'+(reward.kind==='skin'?'Approved skin · '+reward.skin:'Base weapon · unskinned')+'</p>'+
  '<p>'+conditionTag(reward)+'</p>'+conditionPriceRows(reward)+
  '<div class="price">Estimated market value: ≈ '+money(marketEstimate(reward))+' coins</div>'+
  '<p class="muted tiny">Market value is an estimate, not a guaranteed sale price.</p>'+
  '<div class="row"><button class="primary" onclick="inspect(\''+reward.id+'\')">Inspect / sell</button>'+
  '<button onclick="closeDialog()">Keep item</button></div></div>');
}
// UI feedback is opt-out; sounds are synthesized only after a user gesture.
if(typeof document.addEventListener==='function')document.addEventListener('click',event=>{
 const button=event.target&&typeof event.target.closest==='function'&&event.target.closest('button');
 if(!button||button.id==='soundToggle'||(button.closest&&button.closest('#nav')))return;
 const action=button.getAttribute&&button.getAttribute('onclick')||'';
 if(/^(openCase|finishOpening|clickEarn|buy\(|purchase\(|toggleSound)/.test(action))return;
 window.LootHubFX.play('tap');
},{passive:true});
window.addEventListener('beforeunload',save);window.addEventListener('storage',event=>{if(event.key===KEY){saveConflict=true;updateSaveIndicator()}});setInterval(()=>{if(!busy){const result=marketTick();if(tab==='Market'&&result&&result.changed)render()}},30000);render();
</script></body></html>
