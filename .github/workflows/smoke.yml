name: LootHub playable flow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play complete economy loop on mobile viewport
        run: node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loothub-mobile-smoke
          path: tests/mobile-smoke.png
          if-no-files-found: ignore
