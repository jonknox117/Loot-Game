name: LootHub playable flow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Blackout preview artwork for mobile browser checks
        run: |
          python -m pip install 'Pillow>=10,<13'
          python scripts/build_skin_lines.py --self-test
          python scripts/build_skin_lines.py
          python scripts/build_skin_lines.py --check
      - name: Validate save migrations, transactions and Arsenal art manifest
        run: node tests/core.cjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play complete economy loop on mobile viewport
        run: node tests/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loothub-mobile-smoke
          path: |
            tests/mobile-smoke.png
            tests/reel-colors.png
          if-no-files-found: ignore
