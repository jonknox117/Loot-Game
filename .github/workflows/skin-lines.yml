name: Build universal weapon skin lines
on:
  push:
    branches: [feature/universal-skin-lines]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate and verify all neutral-master-derived variants
        run: |
          python scripts/build_skin_lines.py
          python scripts/build_skin_lines.py --check
      - name: Commit deterministic rendered art to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/skin-lines/line-data.js assets/skin-lines/masks assets/renders/lines
          if ! git diff --cached --quiet; then
            git commit -m 'Build transparent universal skin-line assets [skip ci]'
            git push origin HEAD:feature/universal-skin-lines
          fi
